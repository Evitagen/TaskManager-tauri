[package]
name = "task-manager"
version = "2.0.0"
description = "Task Manager — Tauri v2 build (Rust collectors + shared web UI)"
edition = "2021"

[lib]
name = "task_manager_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
regex = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
